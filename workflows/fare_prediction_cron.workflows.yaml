# Google Cloud Workflows: Dynamic Fare Prediction & Waitlist Alert Cron
# Triggers BigQuery ML inference to monitor user saved itineraries for price drops or Tatkal transitions

main:
  steps:
    - fetch_active_watchlists:
        call: http.post
        args:
          url: "https://agent-mesh-yatra-cr.a.run.app/api/analytics/evaluate-watchlists"
          headers:
            Content-Type: "application/json"
          body:
            lookahead_days: 7
            confidence_threshold: 0.85
        result: evaluation_result
    - check_alerts:
        switch:
          - condition: ${len(evaluation_result.body.alerts_triggered) > 0}
            next: broadcast_notifications
        next: finish
    - broadcast_notifications:
        call: http.post
        args:
          url: "https://agent-mesh-yatra-cr.a.run.app/api/notifications/price-drop-broadcast"
          headers:
            Content-Type: "application/json"
          body:
            alerts: ${evaluation_result.body.alerts_triggered}
        result: broadcast_status
        next: finish
    - finish:
        return:
          status: "CRON_COMPLETED"
          alerts_processed: ${len(evaluation_result.body.alerts_triggered)}
